name: spring-app-advisor-workflow
on:
  workflow_dispatch:
  push:
    branches:
      - 'spring-upgrade'
  
jobs:
  app_advisor_job:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Upgrade Spring Application Dependencies
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'
          # cache: maven
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          cache-read-only: false
          gradle-version: '8.14'
      - name: Run Spring Application Advisor
        uses: dbeauregard/spring-app-advisor-action@v1.1.10
        with:
          artifactory_token: ${{ secrets.ARTIFACTORYTOKEN }}
          git_token: ${{ secrets.GITHUB_TOKEN }}
          email: ${{ secrets.EMAIL }}
          build_tool: gradle
      - name: Upload SAA Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAA Logs
          path: ${{ github.workspace }}/.advisor/errors/*.log

        
